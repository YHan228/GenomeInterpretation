name: genome
channels:
  - pytorch
  - nvidia
  - bioconda
  - conda-forge
dependencies:
  # Core
  - python=3.12
  - pip

  # Scientific computing
  - numpy
  - scipy
  - pandas
  - statsmodels

  # Visualization
  - matplotlib
  - seaborn

  # Jupyter
  - ipykernel
  - jupyter_client

  # Bioinformatics
  - macse=2.07
  - openjdk

  # File formats
  - openpyxl
  - h5py

  # CUDA (for PyTorch)
  - cuda-toolkit=12.1

  - pip:
      # Deep learning
      - torch==2.3.1
      - torchvision==0.18.1
      - torchaudio==2.3.1

      # Interpretability
      - captum==0.8.0

      # Hyperparameter optimization
      - optuna>=4.0

      # ML
      - scikit-learn>=1.5
      - pygam>=0.9
      - boruta>=0.4

      # Sequence analysis
      - logomaker
      - pyfaidx

      # Utilities
      - networkx
      - sympy
      - numba
      - umap-learn
      - tqdm
      - pyyaml
      - joblib
      - pillow
